name: Deploy React App

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest —activate

      - name: Install dependencies
        run: pnpm install —frozen-lockfile

      - name: Create .env file
        run: |
          echo "${{ secrets.APP_ENV }}" | base64 —decode > .env

      - name: Build app
        run: pnpm build

      - name: Push to deployment repository
        env:
          GH_TOKEN: ${{ secrets.AUTO_ACTIONS }}
        run: |
          TARGET_REPO="ajou-chong/ajouchong-admin"
          CLONE_DIR="/"
          DEPLOY_BRANCH="${GITHUB_REF##*/}"

          git clone —depth=1 https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git $CLONE_DIR
          cd $CLONE_DIR

          git config —global user.name "GitHub Actions"
          git config —global user.email "github-actions[bot]@users.noreply.github.com"

          if git show-ref —verify —quiet refs/heads/${DEPLOY_BRANCH}; then
            git checkout ${DEPLOY_BRANCH}
          else
            git checkout -b ${DEPLOY_BRANCH}
          fi

          rm -rf *

          mkdir -p app
          cp -r ../dist/* ./app/  # 또는 ../build/*, 빌드 결과물 위치에 따라 조정

          cp ../package.json .
          cp ../pnpm-lock.yaml .
          cp ../turbo.json .
          if [ -f ../pnpm-workspace.yaml ]; then cp ../pnpm-workspace.yaml .; fi
          if [ -f ../tsconfig.base.json ]; then cp ../tsconfig.base.json .; fi

          git add .
          if git diff —cached —quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy app [${{ github.sha }}]"
            git push origin ${DEPLOY_BRANCH}
          fi